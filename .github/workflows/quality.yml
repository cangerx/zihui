name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-app-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: agent_admin_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, curl, fileinfo, gd, pdo_mysql
          tools: composer:v2

      - name: Setup Node for security policy
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Composer definition
        working-directory: agent-admin/backend
        run: composer validate --strict

      - name: Install Laravel dependencies
        working-directory: agent-admin/backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Enforce Composer security policy
        working-directory: agent-admin/backend
        run: |
          composer audit --locked --format=json > "$RUNNER_TEMP/composer-audit.json" || true
          node ../../scripts/check-security-audit.mjs \
            --ecosystem composer \
            --scope agent-admin/backend \
            --audit "$RUNNER_TEMP/composer-audit.json"

      - name: Prepare Laravel environment
        working-directory: agent-admin/backend
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: PHP syntax check
        run: |
          find agent-admin/backend/app agent-admin/backend/config agent-admin/backend/routes -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Verify MySQL 8.0 migrations
        working-directory: agent-admin/backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: agent_admin_test
          DB_USERNAME: root
          DB_PASSWORD: test-root-password
        run: php artisan migrate:fresh --force

      - name: Verify App v1 routes
        working-directory: agent-admin/backend
        run: php artisan route:list --path=api/app/v1

      - name: Run backend tests
        working-directory: agent-admin/backend
        run: php artisan test --without-tty

  multichannel-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_URL: https://api.example.invalid/api/app/v1
      VITE_API_BASE: https://api.example.invalid/api/app/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent-admin/frontend/package-lock.json
            agent-admin/docs-frontend/package-lock.json
            agent-build/backend/package-lock.json
            agent-build/frontend/package-lock.json
            agent-desktop/package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Install workspace
        run: npm ci

      - name: Test security policy
        run: npm run test:security-audit

      - name: Verify DCloud dependency baseline
        run: npm run check:dcloud-dependency-baseline

      - name: Enforce workspace security policy
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-root-audit.json" || true
          node scripts/check-security-audit.mjs \
            --ecosystem npm \
            --scope root \
            --audit "$RUNNER_TEMP/npm-root-audit.json"

      - name: Verify imported UI
        run: npm run check:ui-import

      - name: Verify App v1 contract
        run: npm run check:api-contract

      - name: Test shared API client
        run: npm run test:api-client

      - name: Test mobile task poller
        run: npm run test:mobile-poller

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build Web
        run: npm run build:web

      - name: Build H5
        run: npm run build:mobile:h5
        env:
          VITE_API_BASE: https://api.example.invalid/api/app/v1

      - name: Build Weixin Mini Program
        run: npm run build:mobile:mp-weixin
        env:
          VITE_API_BASE: https://api.example.invalid/api/app/v1

      - name: Verify mobile production contracts
        run: |
          npm run check:mobile-real-api
          npm run check:mobile-production-entrypoints
          npm run check:mobile-production-assets

      - name: Verify independent locks
        run: |
          npm ci --prefix agent-admin/frontend --ignore-scripts
          npm ci --prefix agent-admin/docs-frontend --ignore-scripts
          npm ci --prefix agent-build/backend --ignore-scripts
          npm ci --prefix agent-build/frontend --ignore-scripts
          npm ci --prefix agent-desktop --ignore-scripts
          git diff --exit-code -- package-lock.json agent-admin/frontend/package-lock.json agent-admin/docs-frontend/package-lock.json agent-build/backend/package-lock.json agent-build/frontend/package-lock.json agent-desktop/package-lock.json

      - name: Enforce clean independent production scopes
        run: |
          npm audit --prefix agent-admin/frontend --omit=dev --json > "$RUNNER_TEMP/npm-admin-frontend-audit.json" || true
          node scripts/check-security-audit.mjs \
            --ecosystem npm \
            --scope agent-admin/frontend \
            --audit "$RUNNER_TEMP/npm-admin-frontend-audit.json"
          npm audit --prefix agent-build/backend --omit=dev --json > "$RUNNER_TEMP/npm-build-backend-audit.json" || true
          node scripts/check-security-audit.mjs \
            --ecosystem npm \
            --scope agent-build/backend \
            --audit "$RUNNER_TEMP/npm-build-backend-audit.json"
          npm audit --prefix agent-desktop --omit=dev --registry=https://registry.npmjs.org --json > "$RUNNER_TEMP/npm-desktop-audit.json" || true
          node scripts/check-security-audit.mjs \
            --ecosystem npm \
            --scope agent-desktop \
            --audit "$RUNNER_TEMP/npm-desktop-audit.json"
