name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  multichannel-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_URL: https://api.example.invalid/api/app/v1
      VITE_API_BASE: https://api.example.invalid/api/app/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent-admin/frontend/package-lock.json
            agent-admin/docs-frontend/package-lock.json
            agent-build/backend/package-lock.json
            agent-build/frontend/package-lock.json
            agent-desktop/package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Install workspace
        run: npm ci

      - name: Verify imported UI
        run: npm run check:ui-import

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build Web
        run: npm run build:web

      - name: Build H5
        run: npm run build:mobile:h5

      - name: Build Weixin Mini Program
        run: npm run build:mobile:mp-weixin

      - name: Verify independent locks
        run: |
          npm ci --prefix agent-admin/frontend --ignore-scripts
          npm ci --prefix agent-admin/docs-frontend --ignore-scripts
          npm ci --prefix agent-build/backend --ignore-scripts
          npm ci --prefix agent-build/frontend --ignore-scripts
          npm ci --prefix agent-desktop --ignore-scripts
          git diff --exit-code -- package-lock.json agent-admin/frontend/package-lock.json agent-admin/docs-frontend/package-lock.json agent-build/backend/package-lock.json agent-build/frontend/package-lock.json agent-desktop/package-lock.json

      - name: Block critical production advisories
        run: |
          npm audit --omit=dev --audit-level=critical
          npm audit --prefix agent-admin/frontend --omit=dev --audit-level=critical
          npm audit --prefix agent-build/backend --omit=dev --audit-level=critical
